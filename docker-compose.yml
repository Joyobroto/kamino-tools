services:
  kamino-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: kamino-watcher:latest
    container_name: kamino-watcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Force ANSI colors in logs even without a TTY
      - FORCE_COLOR=1
      # Persistent ALT state lives on the /data volume (survives rebuilds)
      - LIQ_ALT_STATE=/data/liq_alt.json
    volumes:
      # Persist JSONL event log across container restarts/rebuilds
      - ./data:/data
    command: >
      node --disable-warning=ExperimentalWarning --import tsx src/cli.ts scan
      --watch
      --interval ${WATCH_INTERVAL:-60}
      --hot-interval 10
      --log /data/opportunities.jsonl
      --ledger /data/liq_autofire_ledger.jsonl
      --stop-file /data/liq_autofire.stop
      --min-profit ${LIQ_MIN_PROFIT:-0.05}
      --min-prize ${LIQ_MIN_PRIZE:-1.00}
      --slippage-bps ${LIQ_SLIPPAGE_BPS:-50}
      --priority-mode ${LIQ_PRIORITY_MODE:-auto}
      --fast
      --execute
      --broadcast
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
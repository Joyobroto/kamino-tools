services:
  kamino-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: kamino-watcher:latest
    container_name: kamino-watcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Force ANSI colors in logs even without a TTY
      - FORCE_COLOR=1
      # Persistent ALT state lives on the /data volume (survives rebuilds)
      - LIQ_ALT_STATE=/data/liq_alt.json
    volumes:
      # Persist JSONL event log across container restarts/rebuilds
      - ./data:/data
    # --min-debt: sub-$100 positions all carry a prize at or below the fire floor,
    # and they occupy the 400 valuation slots the oracle rail re-values every ~500ms
    # — seeded with dust, that net only re-reads what we cannot win.
    # NOTE: annotations go HERE. The folded scalar below treats '#' as literal
    # command text, so an in-block comment would be passed to the CLI as arguments.
    command: >
      node --disable-warning=ExperimentalWarning --import tsx src/cli.ts scan
      --watch
      --interval ${WATCH_INTERVAL:-120}
      --hot-interval 10
      --log /data/opportunities.jsonl
      --ledger /data/liq_autofire_ledger.jsonl
      --stop-file /data/liq_autofire.stop
      --min-profit ${LIQ_MIN_PROFIT:-0.05}
      --min-prize ${LIQ_MIN_PRIZE:-0}
      --min-debt ${LIQ_MIN_DEBT:-100}
      --slippage-bps ${LIQ_SLIPPAGE_BPS:-50}
      --priority-mode ${LIQ_PRIORITY_MODE:-auto}
      --fast
      --execute
      --broadcast
    healthcheck:
      test: ["CMD", "node", "--import", "tsx", "src/healthcheck.ts"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3